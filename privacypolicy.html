<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a; /* Un gris foncé pour voir si l'iframe bug */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .fallback {
            color: white;
            text-align: center;
            padding: 50px;
            font-family: sans-serif;
        }
        .fallback a { color: #5b6af0; }
    </style>
</head>
<body>

    <iframe src="privacy.pdf#toolbar=0&navpanes=0">
        <div class="fallback">
            <p>Votre navigateur ne prend pas en charge les PDF intégrés.</p>
            <p><a href="privacy.pdf" target="_blank">Cliquez ici pour télécharger le PDF directement</a>.</p>
        </div>
    </iframe>

</body>
</html>
